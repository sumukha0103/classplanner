name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the offline web page
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: python3 web-src/build.py apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed APK
        run: |
          set -o pipefail
          gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Save the build log to a branch (so problems can be read)
        if: always()
        run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          mkdir -p /tmp/bl && cp build.log /tmp/bl/ 2>/dev/null || echo "no log" > /tmp/bl/build.log
          git checkout --orphan build-log && git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/bl/build.log . && git add build.log && git commit -m "build log for run ${{ github.run_number }}" && git push -f origin build-log

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ClassPlanner.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: ClassPlanner-apk
          path: ClassPlanner.apk


  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the offline web page
        shell: bash
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: python web-src/build.py desktop

      - name: Build the Windows installer and portable app
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npm run dist

      - name: Start the built app once and check that it opens
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'desktop/dist/win-unpacked/Class Planner.exe'
          $out = Join-Path $PWD 'smoke.txt'
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke=$out" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host 'app did not finish'; exit 1 }
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'no result file'; exit 1 }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Keep the Windows files
        uses: actions/upload-artifact@v4
        with:
          name: ClassPlanner-windows
          path: |
            desktop/dist/ClassPlanner-Setup.exe
            desktop/dist/ClassPlanner-Portable.exe

  release:
    name: Publish release
    needs: [build, windows]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClassPlanner-apk
          path: out
      - uses: actions/download-artifact@v4
        if: ${{ needs.windows.result == 'success' }}
        with:
          name: ClassPlanner-windows
          path: out
      - name: Publish as a release (phone and Windows downloads)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --target ${{ github.sha }} \
            --title "Class Planner (build ${{ github.run_number }})" \
            --notes "Phone: tap ClassPlanner.apk. Windows: ClassPlanner-Setup.exe installs it for your user account (no admin needed); ClassPlanner-Portable.exe runs without installing."
