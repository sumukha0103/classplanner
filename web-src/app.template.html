<title>Class Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: single column app. Header (name + tabs + import), then either the Timetable
   (toolbar, filters, month/week/day views, day detail, due-soon and coming-up cards) or Attendance
   (to-mark queue, one card per subject). Phone: tabs sit in a bottom bar. Desktop: tabs sit in the header.
   Marks: classes are round dots, official calendar events are diamonds, your own plans are outlined squares. */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --surface2:#f6f7fb; --ink:#131a2c; --muted:#5a6479; --line:#dfe3ed;
  --accent:#3a4bc4; --accent-soft:#e8ebfb; --fill-ink:#ffffff;
  --ok:#177a52; --ok-soft:#e1f4ea; --warn:#97600a; --warn-soft:#fdf0d5; --bad:#b83232; --bad-soft:#fbe4e4;
  --cond:#6a3fc2; --cond-soft:#ece5fa; --hol:#fbeaea; --offbg:#eceef5;
  --k-hol:#b83232; --k-exam:#a15c07; --k-term:#3a4bc4; --k-fest:#0b7a85; --k-other:#5a6479;
  --c0:#3a4bc4; --c1:#d6455d; --c2:#0e9384; --c3:#d98a14; --c4:#7c4dd6; --c5:#2f8fe0; --c6:#5b9e2d; --c7:#c4529c;
  --f-disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1220; --surface:#171d31; --surface2:#1c2339; --ink:#e7eaf6; --muted:#9aa4bd; --line:#2a3350;
  --accent:#8a98ff; --accent-soft:#232c5a; --fill-ink:#0e1220;
  --ok:#5ad19a; --ok-soft:#12352a; --warn:#f0b44d; --warn-soft:#3a2d10; --bad:#ff8585; --bad-soft:#3d1b20;
  --cond:#b79cff; --cond-soft:#2b2250; --hol:#2c1a22; --offbg:#141a2b;
  --k-hol:#ff8585; --k-exam:#f0b44d; --k-term:#8a98ff; --k-fest:#4fd1d9; --k-other:#9aa4bd;
  --c0:#8a98ff; --c1:#ff7f93; --c2:#3fd1be; --c3:#f2b04a; --c4:#b496ff; --c5:#66b4ff; --c6:#92d35a; --c7:#ee86c8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#171d31; --surface2:#1c2339; --ink:#e7eaf6; --muted:#9aa4bd; --line:#2a3350;
  --accent:#8a98ff; --accent-soft:#232c5a; --fill-ink:#0e1220;
  --ok:#5ad19a; --ok-soft:#12352a; --warn:#f0b44d; --warn-soft:#3a2d10; --bad:#ff8585; --bad-soft:#3d1b20;
  --cond:#b79cff; --cond-soft:#2b2250; --hol:#2c1a22; --offbg:#141a2b;
  --k-hol:#ff8585; --k-exam:#f0b44d; --k-term:#8a98ff; --k-fest:#4fd1d9; --k-other:#9aa4bd;
  --c0:#8a98ff; --c1:#ff7f93; --c2:#3fd1be; --c3:#f2b04a; --c4:#b496ff; --c5:#66b4ff; --c6:#92d35a; --c7:#ee86c8;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-inline:16px;padding-block:0 92px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1120px;margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:inline-flex;vertical-align:middle}
.mono{font-family:var(--f-mono)}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-height:40px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}

/* header + nav */
.top{display:flex;align-items:center;gap:14px;padding-block:16px 12px;flex-wrap:wrap}
.brand h1{font-size:23px;line-height:1.1;font-weight:700}
.brand p{color:var(--muted);font-size:13px;margin-top:3px}
.spacer{flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;border-radius:10px;padding:7px 8px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.nav .badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:var(--bad);color:var(--fill-ink);font:600 11px/18px var(--f-mono);text-align:center}
@media (min-width:760px){
  .nav{position:static;display:inline-flex;gap:4px;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--surface)}
  .nav button{flex-direction:row;gap:8px;padding:8px 14px;font-size:14px}
  .nav .badge{position:static;margin-left:2px}
  body{padding-block:0 40px}
}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--fill-ink)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.icon{padding:0;width:38px;justify-content:center}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:520px){.top .btn .lbl{display:none}.top .btn{padding:0;width:38px;justify-content:center}}

/* toolbar + filters */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-block:6px 12px}
.toolbar h2{font-size:20px;font-weight:700;min-width:0;margin-inline:4px}
.vseg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface)}
.toolbar .vseg{margin-left:auto}
.vseg button{border:0;background:none;border-radius:7px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.vseg button[aria-pressed="true"]{background:var(--accent);color:var(--fill-ink)}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--muted);min-height:32px}
.fchip::before{content:'';width:8px;height:8px;background:var(--ec,var(--muted));transform:rotate(45deg);opacity:.4}
.fchip[aria-pressed="true"]{color:var(--ink);background:color-mix(in srgb,var(--ec,var(--accent)) 14%,var(--surface));border-color:color-mix(in srgb,var(--ec,var(--accent)) 45%,var(--line))}
.fchip[aria-pressed="true"]::before{opacity:1}
.fchip.plain::before{display:none}
.fchip.mine::before{transform:none;border-radius:2px;background:transparent;border:1.5px solid var(--ec)}

/* cards, chips, tags */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.code{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-mono);padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--cc) 14%,var(--surface));white-space:nowrap}
.code i{width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.hol{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.off{background:var(--offbg)}
.tag.buf{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ins{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.pill.A{background:var(--ok-soft);color:var(--ok)} .pill.M{background:var(--bad-soft);color:var(--bad)} .pill.C{background:var(--cond-soft);color:var(--cond)}
.pill.U{background:var(--warn-soft);color:var(--warn)}
.pill.X{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13.5px;margin-top:10px}

/* events (official = diamond) and own plans (outlined square) */
.ek-holiday{--ec:var(--k-hol)} .ek-exam{--ec:var(--k-exam)} .ek-term{--ec:var(--k-term)} .ek-fest{--ec:var(--k-fest)} .ek-other{--ec:var(--k-other)} .ek-mine{--ec:var(--accent)}
.ev{display:inline-block;max-width:100%;font-size:12.5px;font-weight:600;line-height:1.35;padding:2px 9px;border-radius:99px;color:color-mix(in srgb,var(--ec) 78%,var(--ink));background:color-mix(in srgb,var(--ec) 15%,var(--surface))}
.ev::before{content:'';display:inline-block;width:6px;height:6px;margin-right:6px;background:var(--ec);transform:rotate(45deg);vertical-align:1px}
.ev.pl::before{width:8px;height:8px;border-radius:2px;transform:none;background:transparent;border:1.5px solid var(--ec);vertical-align:-1px}
.ev.pl.done{text-decoration:line-through;opacity:.6}
.ev.pl.done::before{background:var(--ec)}
.ev.pl.late{--ec:var(--bad)}
.evs{display:flex;flex-direction:column;gap:2px;width:100%;min-width:0}
.evrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.evrow .sub{color:var(--muted);font-size:12.5px}

/* month grid */
.tt-main{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.tt-main.month{grid-template-columns:minmax(0,1fr) 350px;align-items:start}}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dow{background:var(--surface2);padding:8px 6px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;text-align:center}
.cell{position:relative;background:var(--surface);border:0;border-radius:0;min-height:104px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell.out{background:var(--surface2);color:var(--muted)}
.cell.hol{background:var(--hol)} .cell.off{background:var(--offbg)}
.cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
.num{font:600 13px var(--f-mono);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.today .num{background:var(--accent);color:var(--fill-ink)}
.warnb{position:absolute;top:5px;right:5px;width:16px;height:16px;border-radius:50%;background:var(--warn);color:var(--fill-ink);font:700 11px/16px var(--f-mono);text-align:center}
.lab{font-size:10.5px;color:var(--muted);line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 10.5px var(--f-mono);padding:2px 5px;border-radius:6px;background:color-mix(in srgb,var(--cc) 14%,var(--surface))}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--cc)}
.chip.more{background:none;color:var(--muted)}
.chip.x{opacity:.5;text-decoration:line-through}
.cell .ev{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;padding:1px 6px;width:100%}
.cell .ev::before{margin-right:4px}
.cell .more{font-size:10.5px;color:var(--muted);font-weight:600}
@media (max-width:640px){
  .cell{min-height:70px;padding:4px;align-items:center}
  .chip{padding:0;background:none}.chip .t{display:none}.chip i{width:8px;height:8px}
  .chips{justify-content:center;max-width:44px}.cell .lab{display:none}.dow{padding:6px 0;font-size:10.5px;letter-spacing:.02em}
  .evs{flex-direction:row;flex-wrap:wrap;justify-content:center;max-width:44px}
  .cell .ev{font-size:0;line-height:0;height:4px;width:12px;padding:0;border-radius:2px;background:var(--ec)}
  .cell .ev::before{display:none}
  .cell .ev.pl.done{opacity:.4;text-decoration:none}
  .cell .more{display:none}
  .warnb{top:2px;right:2px;width:14px;height:14px;font-size:10px;line-height:14px}
}

/* day panel + session rows */
.dp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dp-head h3{font-size:18px}
.lab-line{margin-top:10px;color:var(--muted)}
.empty-day{margin-top:14px;color:var(--muted)}
.srow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding-block:13px;border-top:1px solid var(--line)}
.srow.first{margin-top:12px}
.stime{font:600 13px/1.3 var(--f-mono)}.stime .tend{display:block;color:var(--muted);font-weight:500}
.sname{font-weight:600;font-size:15.5px}
.smeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;color:var(--muted);font-size:13px;margin-top:4px}
.srow.ev .sname{color:var(--muted);font-weight:500}
.srow.cx .sname{color:var(--muted);text-decoration:line-through}
.srow.plan .sname{display:flex;align-items:flex-start;gap:8px}
.srow.plan.done .ptitle{text-decoration:line-through;color:var(--muted)}
.srow .acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mv-tag{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--surface2);border-radius:99px;padding:1px 8px}
.srow.plan .acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:var(--surface);display:inline-grid;place-items:center;padding:0;flex:none;margin-top:1px;font:700 13px/1 var(--f-body);color:var(--fill-ink)}
.chk[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.pmark{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);flex:none;margin-top:6px}
.late-tag{font-size:11.5px;font-weight:600;color:var(--bad);background:var(--bad-soft);border-radius:99px;padding:1px 8px}

/* attendance buttons */
.segwrap{margin-top:10px;display:flex;flex-direction:column;align-items:stretch;gap:2px}
.segwrap.sm{margin-top:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.xb{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:5px 2px;min-height:30px;text-decoration:underline;text-underline-offset:3px}
.xb:hover{color:var(--ink)}
.xb.on{background:var(--surface2);color:var(--ink);border-radius:8px;padding:5px 10px;text-decoration:none;border:1px solid var(--line)}
.sb{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 2px;font-weight:600;font-size:12.5px;min-height:40px;white-space:nowrap;min-width:0}
.seg.sm .sb{min-height:34px;font-size:12.5px;padding:5px 2px}
.sb.a:hover:not(:disabled){border-color:var(--ok);color:var(--ok)} .sb.m:hover:not(:disabled){border-color:var(--bad);color:var(--bad)} .sb.c:hover:not(:disabled){border-color:var(--cond);color:var(--cond)}
.sb.a.on{background:var(--ok);border-color:var(--ok);color:var(--fill-ink)}
.sb.m.on{background:var(--bad);border-color:var(--bad);color:var(--fill-ink)}
.sb.c.on{background:var(--cond);border-color:var(--cond);color:var(--fill-ink)}
.sb:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}

/* week */
.week{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.week{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.wcol.today{border-color:var(--accent)}
.wcol.hol{background:var(--hol)} .wcol.off{background:var(--offbg)}
.wh{border:0;background:none;text-align:left;padding:0;display:flex;align-items:baseline;gap:8px;font-weight:600}
.wh .d{font:600 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wh .n{font:700 18px var(--f-disp)}
.wcard{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.wcard:hover{border-color:var(--accent)}
.wcard .tm{font:500 11.5px var(--f-mono);color:var(--muted)}
.wcard .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.wcard .row{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.wcol .ev{white-space:normal}
.wnone{color:var(--muted);font-size:13px}
.dstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.dstrip button{flex:1 0 auto;min-width:54px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.dstrip button b{font:700 16px var(--f-disp);color:var(--ink)}
.dstrip button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dstrip button.hol{background:var(--hol)}

/* due soon + coming up */
.twocol{display:grid;gap:16px;margin-top:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.twocol{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.listitem{display:flex;align-items:center;gap:10px;padding-block:10px;border-top:1px solid var(--line);min-width:0}
.listitem:first-of-type{margin-top:10px}
.li-main{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.li-main .t{font-weight:600;overflow-wrap:anywhere}
.li-main .s{display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center;color:var(--muted);font-size:12.5px}
.li-when{font:500 12px var(--f-mono);color:var(--muted);text-align:right;white-space:nowrap}
.li-when.late{color:var(--bad)}
.dmark{width:8px;height:8px;background:var(--ec);transform:rotate(45deg);flex:none}

/* attendance */
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-block:6px 14px}
.sec-head h2{font-size:22px}
.sec-head p{color:var(--muted);font-size:13.5px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead h3{font-size:17px}
.count{font:600 12px var(--f-mono);background:var(--bad);color:var(--fill-ink);border-radius:99px;padding:1px 8px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.qrow:first-of-type{margin-top:12px}
@media (min-width:760px){.qrow{grid-template-columns:minmax(0,1fr) 340px;align-items:center;gap:16px}}
.qwhen{font:500 12.5px var(--f-mono);color:var(--muted)}
.qwhat{font-weight:600}
.skiprow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.skiprow:first-of-type{margin-top:12px}
@media (min-width:760px){.skiprow{grid-template-columns:minmax(0,1fr) 340px;align-items:center;gap:16px}}
.skv{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.skv .nums{font:500 12.5px var(--f-mono);color:var(--muted)}
.skv .why{font-size:12.5px;color:var(--muted)}
.skipline{display:flex;flex-direction:column;gap:3px;align-items:flex-start;margin-top:8px;font-size:12.5px}
.skipline .nums{font:500 12px var(--f-mono);color:var(--muted)}
.caught{display:flex;gap:12px;align-items:center;color:var(--muted);margin-top:6px}
.caught b{color:var(--ok)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px;margin-top:16px}
.sc{display:flex;flex-direction:column;gap:14px;min-width:0}
.sc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sc h3{font-size:17px;line-height:1.25}
